
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Wave Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#06070d;--card:#121420;--cyan:#00f3ff;--pink:#ff007f;--purple:#9d00ff;--muted:#8b949e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f0f4f8;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh}
.app{max-width:1200px;margin:auto;padding:20px}
header,.panel{background:rgba(18,20,32,.94);border:1px solid #ffffff18;border-radius:20px;padding:20px;margin-bottom:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font:900 1.4rem Orbitron,sans-serif;background:linear-gradient(90deg,var(--cyan),var(--pink));color:var(--cyan)}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;color:white;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple))}
input{min-width:0;padding:14px;border-radius:12px;border:1px solid #ffffff25;background:#090a12;color:white;font:inherit}
.search{display:flex;gap:10px}
.search input{flex:1;width:100%}
.layout{display:grid;grid-template-columns:1fr 380px;gap:20px}
.status{color:var(--cyan);font-size:.85rem;margin:14px 0}
.results{display:grid;gap:10px;max-height:620px;overflow:auto}
.track{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid #ffffff15;border-radius:12px;cursor:pointer}
.track:hover{border-color:var(--cyan);background:#ffffff08}
.track img{width:90px;height:60px;object-fit:cover;border-radius:8px}
.info{flex:1;min-width:0}
.title{font-weight:700;font-size:.9rem}
.author{font-size:.78rem;color:var(--muted);margin-top:5px}
.player{text-align:center}
#player-title{font-weight:700;margin:14px 0 5px}
#player-author{color:var(--muted);font-size:.85rem;margin-bottom:15px}
#yt-player-wrap{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
#yt-player-wrap iframe{width:100%;height:100%;border:0}
.controls{display:flex;justify-content:center;gap:12px;margin:18px 0}
.controls button{min-width:55px}
#progress{width:100%;accent-color:var(--cyan)}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem}
.secondary{background:#29243c}
.modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal-content{background:var(--card);border:1px solid var(--purple);border-radius:20px;padding:28px;max-width:400px;text-align:center}
@media(max-width:850px){.layout{grid-template-columns:1fr}.app{padding:12px}header{padding:15px}h1{font-size:1.05rem}}
@media(max-width:450px){.search{flex-direction:column}.search button{width:100%}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1><i class="fas fa-compact-disc"></i> NEON WAVE</h1>
  <button class="secondary" id="dev-btn"><i class="fas fa-code"></i> Developer</button>
</header>

<div class="layout">
<section class="panel">
  <form class="search" id="search-form">
    <input id="search-input" placeholder="Search song, artist, or paste YouTube link..." autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <div class="status" id="status">Ready to search YouTube.</div>
  <div class="results" id="results"></div>
</section>

<section class="panel player">
  <div style="color:var(--cyan);font-weight:700;margin-bottom:12px">
    <i class="fas fa-headphones"></i> NOW PLAYING
  </div>
  <div id="yt-player-wrap">
    <div id="yt-player"></div>
  </div>
  <div id="player-title">Select a song</div>
  <div id="player-author">YouTube</div>
  <input id="progress" type="range" min="0" max="100" value="0">
  <div class="times"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
  <div class="controls">
    <button class="secondary" id="prev" aria-label="Previous"><i class="fas fa-backward"></i></button>
    <button id="play" aria-label="Play"><i class="fas fa-play"></i></button>
    <button class="secondary" id="next" aria-label="Next"><i class="fas fa-forward"></i></button>
  </div>
  <button class="secondary" id="open-video" style="width:100%">
    <i class="fab fa-youtube"></i> Open video on YouTube
  </button>
</section>
</div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button id="close-modal" class="secondary" style="float:right">✕</button>
    <h2 style="font-family:Orbitron;color:var(--cyan)">NEON WAVE</h2>
    <p style="color:var(--pink);font-weight:700">Developed by Tarun</p>
    <p style="color:var(--muted)">Neon Wave Premium — YouTube search and playback.</p>
    <a href="https://www.instagram.com/tarun.amv/" target="_blank" rel="noopener" style="color:var(--cyan)">Instagram</a>
  </div>
</div>

<script>
const YOUTUBE_API_KEY = "YOUR_NEW_API_KEY";

const $ = id => document.getElementById(id);
const status = $("status");
let player = null;
let ready = false;
let playlist = [];
let index = -1;
let progressTimer = null;

function setStatus(message){ status.textContent = message; }

function formatTime(value){
  if(!Number.isFinite(value) || value < 0) return "0:00";
  const s = Math.floor(value);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

function getVideoId(text){
  try{
    const url = new URL(text);
    if(url.hostname === "youtu.be") return url.pathname.split("/")[1] || null;
    if(url.hostname.endsWith("youtube.com")){
      if(url.pathname === "/watch") return url.searchParams.get("v");
      const parts = url.pathname.split("/");
      if(["embed","shorts","live"].includes(parts[1])) return parts[2] || null;
    }
  }catch{}
  return /^[a-zA-Z0-9_-]{11}$/.test(text) ? text : null;
}

function onYouTubeIframeAPIReady(){
  player = new YT.Player("yt-player",{
    width:"100%",
    height:"100%",
    videoId:"",
    playerVars:{playsinline:1,controls:1,rel:0},
    events:{
      onReady:()=>{
        ready = true;
        setStatus("YouTube player ready. Search for a song.");
      },
      onStateChange:event=>{
        if(event.data === YT.PlayerState.PLAYING){
          $("play").innerHTML='<i class="fas fa-pause"></i>';
          setStatus("Playing on YouTube.");
          startProgress();
        }else{
          $("play").innerHTML='<i class="fas fa-play"></i>';
          if(event.data === YT.PlayerState.ENDED) nextTrack();
          if(event.data !== YT.PlayerState.PLAYING) stopProgress();
        }
      },
      onError:event=>{
        setStatus("YouTube playback error ("+event.data+"). Try another video.");
      }
    }
  });
}

function startProgress(){
  stopProgress();
  progressTimer = setInterval(()=>{
    if(!player || !ready) return;
    const duration = player.getDuration() || 0;
    const current = player.getCurrentTime() || 0;
    $("progress").value = duration ? current/duration*100 : 0;
    $("current-time").textContent = formatTime(current);
    $("duration").textContent = formatTime(duration);
  },500);
}

function stopProgress(){
  if(progressTimer) clearInterval(progressTimer);
  progressTimer = null;
}

function playTrack(i){
  if(!playlist.length || !ready) return;
  index = (i + playlist.length) % playlist.length;
  const track = playlist[index];
  $("player-title").textContent = track.title;
  $("player-author").textContent = track.author;
  $("open-video").disabled = false;
  player.loadVideoById(track.id);
  renderResults();
}

function nextTrack(){ if(playlist.length) playTrack(index+1); }
function prevTrack(){ if(playlist.length) playTrack(index-1); }

function renderResults(){
  const list = $("results");
  list.replaceChildren();
  playlist.forEach((track,i)=>{
    const card = document.createElement("div");
    card.className = "track";

    const img = document.createElement("img");
    img.src = track.thumb;
    img.alt = "";
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = track.title;

    const author = document.createElement("div");
    author.className = "author";
    author.textContent = track.author;

    info.append(title,author);
    card.append(img,info);

    if(i === index) card.style.borderColor = "var(--cyan)";
    card.addEventListener("click",()=>playTrack(i));
    list.append(card);
  });
}

async function searchYouTube(query){
  if(!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "YOUR_NEW_API_KEY"){
    throw new Error("Add your new API key in the YOUTUBE_API_KEY line.");
  }

  const params = new URLSearchParams({
    part:"snippet",
    type:"video",
    videoEmbeddable:"true",
    maxResults:"10",
    q:query,
    regionCode:"IN",
    key:YOUTUBE_API_KEY
  });

  const response = await fetch(
    "https://www.googleapis.com/youtube/v3/search?"+params
  );
  const data = await response.json();

  if(!response.ok){
    const reason = data.error?.errors?.[0]?.reason;
    throw new Error(reason || data.error?.message || "YouTube API request failed");
  }

  return (data.items || [])
    .filter(item=>item.id?.videoId)
    .map(item=>({
      id:item.id.videoId,
      title:item.snippet.title,
      author:item.snippet.channelTitle,
      thumb:item.snippet.thumbnails?.medium?.url ||
            item.snippet.thumbnails?.default?.url ||
            "https://placehold.co/320x180/121420/00f3ff?text=Neon+Wave"
    }));
}

$("search-form").addEventListener("submit",async event=>{
  event.preventDefault();
  const query = $("search-input").value.trim();
  if(!query) return;

  const videoId = getVideoId(query);
  if(videoId){
    const directTrack = {
      id:videoId,
      title:"YouTube video",
      author:"YouTube",
      thumb:"https://i.ytimg.com/vi/"+videoId+"/hqdefault.jpg"
    };
    playlist = [directTrack,...playlist.filter(t=>t.id!==videoId)];
    renderResults();
    if(ready) playTrack(0);
    else setStatus("YouTube player is still loading.");
    return;
  }

  setStatus("Searching YouTube...");
  $("results").replaceChildren();

  try{
    playlist = await searchYouTube(query);
    if(!playlist.length){
      setStatus("No results found. Try another search.");
      return;
    }
    index = -1;
    renderResults();
    setStatus("Found "+playlist.length+" results. Select one to play.");
  }catch(error){
    console.error(error);
    setStatus("Search failed: "+error.message);
  }
});

$("play").addEventListener("click",()=>{
  if(!ready){setStatus("YouTube player is loading.");return;}
  if(index < 0){
    if(playlist.length) playTrack(0);
    else setStatus("Search for a song first.");
    return;
  }
  const state = player.getPlayerState();
  if(state === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
});

$("next").addEventListener("click",nextTrack);
$("prev").addEventListener("click",prevTrack);

$("progress").addEventListener("change",()=>{
  if(!ready || index < 0) return;
  const duration = player.getDuration();
  if(duration) player.seekTo(duration * Number($("progress").value)/100,true);
});

$("open-video").addEventListener("click",()=>{
  if(index < 0 || !playlist[index]) return;
  window.open("https://www.youtube.com/watch?v="+playlist[index].id,"_blank","noopener");
});

$("dev-btn").addEventListener("click",()=>{$("modal").style.display="flex";});
$("close-modal").addEventListener("click",()=>{$("modal").style.display="none";});
$("modal").addEventListener("click",event=>{
  if(event.target === $("modal")) $("modal").style.display="none";
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
